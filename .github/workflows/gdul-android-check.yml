name: Guitar Dream Universal Launcher Android check

on:
  push:
    branches:
      - feature/repo/android-touch-controls
    paths:
      - 'gd-engine-launcher/**'
      - 'gd-game-01/**'
      - 'gd-game-02/**'
      - 'gd-game-03/**'
      - 'gd-game-04/**'
      - '.github/workflows/gdul-android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Integrated launcher APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;4.1.2 platforms;android-36 build-tools;36.1.0

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            gd-engine-launcher/build/android/SDL3-*
          key: android-gdul-check-${{ hashFiles('gd-engine-launcher/android/**/*.gradle', 'gd-engine-launcher/android/gradle/wrapper/*.properties', 'gd-game-02/engine/build_android.sh') }}

      - uses: actions/cache@v6
        with:
          path: gd-game-02/engine/build/ffmpeg/android/*/ffmpeg-prefix
          key: ffmpeg-gdul-check-android-${{ hashFiles('gd-game-02/engine/build_common.sh', 'gd-engine-launcher/scripts/build.sh') }}

      - uses: actions/cache@v6
        with:
          path: |
            gd-game-02/engine/build/ffmpeg-src
            gd-game-04/engine/build/ffmpeg-src
          key: ffmpeg-src-7.1.5

      - name: Build the complete launcher and all ready game modules
        run: gd-engine-launcher/scripts/build.sh android --force

      - name: Verify the integrated APK
        run: |
          V="$(sed -n 's/^launcher_version:[[:space:]]*"\{0,1\}\([^"#[:space:]]*\).*/\1/p' gd-engine-launcher/launcher-info.yaml)"
          APK="gd-engine-launcher/local_builds/gdul-$V-android-arm64/gdul-$V-android-arm64.apk"
          test -f "$APK"
          gd-engine-launcher/scripts/verify_bundle.sh "$APK"
          mkdir -p out
          cp "$APK" out/

      - uses: actions/upload-artifact@v7
        with:
          name: gdul-android-arm64-test
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gdul-android-check-logs
          path: |
            gd-engine-launcher/logs/
            gd-game-02/engine/build/ffmpeg/**/ffmpeg-build.log
          if-no-files-found: ignore
          retention-days: 7
