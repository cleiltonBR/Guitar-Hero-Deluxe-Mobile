name: gd-game-03 Android build

on:
  push:
    branches:
      - feature/repo/android-touch-controls
    paths:
      - 'gd-game-03/**'
      - '.github/workflows/gd-game-03-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;4.1.2 platforms;android-36 build-tools;36.1.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            gd-game-03/engine/build/android/SDL3-*
          key: android-gd03-${{ hashFiles('gd-game-03/engine/android/**/*.gradle', 'gd-game-03/engine/android/gradle/wrapper/*.properties', 'gd-game-03/engine/build_android.sh') }}

      - name: Build APK (arm64-v8a)
        run: ABIS=arm64-v8a gd-game-03/engine/build_android.sh

      - name: Package APK
        run: gd-game-03/engine/package.sh android touch-ci out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gd03-android-arm64
          path: gd-game-03/engine/out/
          if-no-files-found: error
          retention-days: 7
